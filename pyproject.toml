[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tutor-from-doc"
version = "0.1.0"
description = "Turn any PDF or document into an interactive, grounded AI tutor for students with zero hallucination."
readme = "README.md"
authors = [
  { name = "TutorFromDoc Team" }
]
license = { text = "MIT" }
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Education",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Education",
    "Topic :: Scientific/Engineering :: Artificial Intelligence"
]
requires-python = ">=3.9"
dependencies = [
    "pypdf>=3.0.0",
    "numpy>=1.21.0",
    "fastapi>=0.95.0",
    "uvicorn>=0.20.0",
    "pydantic>=2.0.0",
    "python-multipart>=0.0.6"
]

[project.optional-dependencies]
ml = [
    "sentence-transformers>=2.2.0",
    "faiss-cpu>=1.7.0"
]
dev = [
    "pytest>=7.0.0",
    "httpx>=0.24.0"
]

[project.urls]
Homepage = "https://github.com/TurboRx/tutor-from-doc"
Repository = "https://github.com/TurboRx/tutor-from-doc.git"
Issues = "https://github.com/TurboRx/tutor-from-doc/issues"

[tool.setuptools.packages.find]
where = ["src"]
